worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

   log_format main '$http_x_forwarded_for - $remote_user [$time_local] "$host" "$request" '
               '$status $body_bytes_sent "$http_referer" '
               '"$http_user_agent" $request_time';

    upstream web_upstream {
        zone web_upstream 64k;
        server web:80 resolve;
        keepalive 16;
    }

    upstream grpc_upstream {
        zone grpc_upstream 64k;
        server server:9999 resolve;
        keepalive 32;
    }

    upstream envoy_admin_upstream {
        zone envoy_admin_upstream 64k;
        server envoy:9901 resolve;
        keepalive 4;
    }

    upstream grafana_upstream {
        zone grafana_upstream 64k;
        server grafana:3000 resolve;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        listen [::]:80;
        http2 on;
        server_name main;

        client_max_body_size 64m;

        location = / {
            return 302 /web/;
        }

        location = /web {
            return 301 /web/;
        }

        location /web/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /web;
            proxy_pass http://web_upstream/;
        }

        location /grid.GridService/ {
            grpc_pass grpc://grpc_upstream;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location = /envoy-adm {
            return 301 /envoy-adm/;
        }

        location /envoy-adm/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /envoy-adm;
            proxy_pass http://envoy_admin_upstream/;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://grafana_upstream;
        }

        include /etc/nginx/conf.d/ssl-server.conf;
    }
}
