worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    resolver 127.0.0.11 ipv6=off valid=30s;

    upstream web_upstream {
        server web:80 resolve;
        keepalive 16;
    }

    upstream api_upstream {
        zone api_upstream 64k;
        server server:9999 resolve;
        keepalive 32;
    }

    upstream envoy_upstream {
        server envoy:8082 resolve;
        keepalive 16;
    }

    upstream envoy_admin_upstream {
        server envoy:9901 resolve;
        keepalive 4;
    }

    upstream grafana_upstream {
        server grafana:3000 resolve;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $NGINX_TLS_MODE $redirect_to_https {
        default 0;
        https 1;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        client_max_body_size 32m;

        if ($redirect_to_https) {
            return 301 https://$host$request_uri;
        }

        location = / {
            return 302 /web/;
        }

        location = /web {
            return 301 /web/;
        }

        location /web/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /web;
            proxy_pass http://web_upstream/;
        }

        location /api/ {
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;
            grpc_pass grpc://api_upstream;
        }

        location = /envoy {
            return 301 /envoy/;
        }

        location /envoy/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /envoy;
            proxy_pass http://envoy_upstream/;
        }

        location = /envoy-adm {
            return 301 /envoy-adm/;
        }

        location /envoy-adm/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /envoy-adm;
            proxy_pass http://envoy_admin_upstream/;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://grafana_upstream/;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 32m;

        location = / {
            return 302 /web/;
        }

        location = /web {
            return 301 /web/;
        }

        location /web/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /web;
            proxy_pass http://web_upstream/;
        }

        location /api/ {
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;
            grpc_pass grpc://api_upstream;
        }

        location = /envoy {
            return 301 /envoy/;
        }

        location /envoy/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /envoy;
            proxy_pass http://envoy_upstream/;
        }

        location = /envoy-adm {
            return 301 /envoy-adm/;
        }

        location /envoy-adm/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /envoy-adm;
            proxy_pass http://envoy_admin_upstream/;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://grafana_upstream/;
        }
    }
}
